# API 兼容性报告（japicmp）：与上一发布版 1.3.18 对比二进制/源码兼容性
# 默认仅报告（1.4.0 为计划内 BREAKING 版本）；需要卡点时把 parent pom 中
# breakBuildOnBinaryIncompatibleModifications 改为 true
name: API Compatibility

on:
  push:
    branches: [ master, main ]
  pull_request:
    paths:
      - '**/pom.xml'
      - 'migoo-framework-dependencies/pom.xml'
  workflow_dispatch:

concurrency:
  group: api-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  japicmp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Compare API
        run: ./mvnw -B clean verify -Pjapicmp -DskipTests -Dgpg.skip=true

      - name: Publish to Summary
        if: always()
        run: |
          {
            echo "## japicmp API 兼容性报告（vs ${japicmp_old_version}）"
            found=0
            for f in migoo-framework-parent/*/target/japicmp/japicmp.md; do
              if [ -f "$f" ]; then
                found=1
                echo "### $(basename "$(dirname "$(dirname "$(dirname "$f")")")")"
                cat "$f"
                echo ""
              fi
            done
            if [ "$found" -eq 0 ]; then echo "_未生成报告_"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          japicmp_old_version: '1.3.18'

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japicmp-reports
          path: migoo-framework-parent/*/target/japicmp/
          retention-days: 14
          if-no-files-found: ignore
