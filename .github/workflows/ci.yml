# PR/push 门禁：发布清单一致性校验 + 全量构建测试 + 覆盖率门禁
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

# 同一分支/PR 的新提交取消进行中的旧构建
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 发布前校验「父 pom <modules> / BOM / -pl 清单 / Summary」四方对齐 + 版本号全仓一致
      # （详见 docs/observability.md §10，脚本本地也可执行）
      - name: Check Module List Consistency
        run: bash scripts/check-publish-modules.sh

      # 父 pom 把 maven-gpg-plugin:sign 绑在 verify 阶段，CI 无密钥 → 跳过签名
      # verify 阶段同时执行 JaCoCo prepare-agent / report / check（单模块行+分支 ≥50%）
      - name: Build with Tests
        run: mvn clean verify -Dgpg.skip=true

      # 聚合门禁：全仓行覆盖率 ≥ 75%（防止单模块底线之上的缓慢劣化）
      - name: Coverage Gate
        run: bash scripts/check-coverage.sh

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: migoo-framework-parent/*/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  # 示例工程（examples/）独立于主 reactor：先装载框架构件到本地仓库，
  # 再端到端构建并运行 @SpringBootTest 冒烟（登录换 token / CORS 四档 / 权限 403 等完整链路）
  examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install framework to local repository
        run: mvn install -DskipTests -Dgpg.skip=true

      - name: Build and test examples
        run: mvn -f examples/pom.xml verify
