# OWASP dependency-check：扫描第三方依赖已知 CVE（NVD 数据库）
# 不占用 PR 关键路径：每月定时执行 + 手动触发，结果以 artifact 归档
name: Dependency Check (OWASP)

on:
  schedule:
    # 每月 5 号 06:00 UTC
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # failBuildOnCVSS=7：发现 High（≥7.0）及以上漏洞即失败
      # NVD 未配置 API Key 时限速较慢，可通过仓库 Secret NVD_API_KEY 提速
      - name: Run OWASP dependency-check
        run: |
          NVD_ARGS=""
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            NVD_ARGS="-DnvdApiKey=${{ secrets.NVD_API_KEY }}"
          fi
          mvn -B org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON \
            -DskipTestScope=true \
            $NVD_ARGS

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30
          if-no-files-found: ignore
